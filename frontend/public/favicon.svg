<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d21" />
      <stop offset="100%" stop-color="#16173a" />
    </linearGradient>

    <!-- Beam Gradient (Electric Cyan -> Crisp Ice -> Royal Indigo) -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="48%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Lightning Bolt Outer Gradient (Electric Amber to Radiant Gold) -->
    <linearGradient id="boltGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ambient Core Glow Filters -->
    <filter id="coreAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="beamShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. Deep Space Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#spaceBg)" />

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="150" fill="#6366f1" opacity="0.45" filter="url(#coreAura)" />
  <circle cx="256" cy="256" r="100" fill="#06b6d4" opacity="0.5" filter="url(#coreAura)" />

  <!-- Double Glass Rims -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#6366f1" stroke-width="7" stroke-opacity="0.6" />
  <rect x="25" y="25" width="462" height="462" rx="107" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2" />

  <!-- 2. Transfer Beam (Top-Left to Bottom-Right) -->
  <g filter="url(#beamShadow)">
    <line x1="112" y1="112" x2="400" y2="400" stroke="url(#beamGrad)" stroke-width="82" stroke-linecap="round" />
    
    <!-- Top-Left Device Node -->
    <circle cx="112" cy="112" r="23" fill="#0c0d21" />
    <circle cx="112" cy="112" r="12" fill="#06b6d4" />

    <!-- Bottom-Right Device Node -->
    <circle cx="400" cy="400" r="23" fill="#0c0d21" />
    <circle cx="400" cy="400" r="12" fill="#6366f1" />
  </g>

  <!-- 3. Crossing Electric Lightning Bolt (Top-Right to Bottom-Left) -->
  <g filter="url(#boltShadow)">
    <!-- Outer Bolt -->
    <polygon points="
      390,102
      415,128
      286,246
      338,251
      122,410
      226,266
      174,261
    " fill="url(#boltGrad)" />

    <!-- White-Hot Core -->
    <polygon points="
      378,118
      286,240
      312,246
      148,384
      226,272
      200,266
    " fill="#ffffff" opacity="0.95" />
  </g>
</svg>
